name: Portfolio quality checks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm run test:run
